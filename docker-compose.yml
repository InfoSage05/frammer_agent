version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frammer-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist data across container restarts
      - ./data:/app/frammer_agent/data
      - ./logs:/app/frammer_agent/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FRAMMER_DATA_DIR=/app
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
