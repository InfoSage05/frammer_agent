# Base Configuration
# Used for all environments - override in environment-specific files

server:
  host: 0.0.0.0
  port: 8000
  debug: false
  workers: 1
  reload: false

database:
  sqlite_path: data/registry.db
  chroma_path: data/chroma
  connection_pool_size: 5
  log_queries: false

llm:
  fast_model: llama-3.1-8b-instant
  think_model: llama-3.3-70b-versatile
  timeout: 30
  max_retries: 3

execution:
  timeout: 90
  max_retries: 5
  max_context_tokens: 8000
  sandbox_enabled: true

extensions:
  plugin_paths:
    - backend/plugins
  auto_discover: true
  auto_load: true

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file_path: logs/frammer.log
  max_file_size: 10000000
  backup_count: 5

# Add custom settings here
custom_settings: {}
