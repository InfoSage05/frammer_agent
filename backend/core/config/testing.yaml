# Testing Configuration
# Loaded for test environment - uses fast, isolated settings

server:
  port: 9000
  debug: false

database:
  sqlite_path: data/test_registry.db
  log_queries: false

llm:
  timeout: 10
  max_retries: 1

execution:
  timeout: 30
  sandbox_enabled: false

logging:
  level: WARNING

extensions:
  auto_discover: false
  auto_load: false

custom_settings:
  enable_debug_endpoints: false
  mock_llm: true
