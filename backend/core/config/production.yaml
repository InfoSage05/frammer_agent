# Production Configuration
# Loaded on top of base.yaml for production environment

server:
  debug: false
  reload: false
  workers: 4

database:
  log_queries: false

logging:
  level: INFO

extensions:
  auto_discover: false
  auto_load: true

# Production settings
custom_settings:
  enable_debug_endpoints: false
  verbose_logging: false
  max_request_size: 10485760  # 10MB
